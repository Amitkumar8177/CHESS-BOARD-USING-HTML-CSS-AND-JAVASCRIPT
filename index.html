<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board using html and css</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-controls">
        <p id="game-status" role="status" aria-live="polite">White to move</p>
        <label for="game-mode">Mode</label>
        <select id="game-mode">
            <option value="two-player">Two players</option>
            <option value="human-white">Play as White</option>
            <option value="human-black">Play as Black</option>
        </select>
        <label for="computer-level">Computer</label>
        <select id="computer-level">
            <option value="1">Easy</option>
            <option value="2" selected>Medium</option>
            <option value="3">Hard</option>
        </select>
        <label for="promotion-choice">Promote to</label>
        <select id="promotion-choice">
            <option value="q">Queen</option>
            <option value="r">Rook</option>
            <option value="b">Bishop</option>
            <option value="n">Knight</option>
        </select>
        <button id="reset-game" type="button">New game</button>
    </div>
    <div class="chess-board" role="grid" aria-label="Chess board">
        <!-- Rank 8 -->
        <div class="square-black"><span class="piece-black">&#9820;</span></div>
        <div class="square-white"><span class="piece-black">&#9822;</span></div>
        <div class="square-black"><span class="piece-black">&#9821;</span></div>
        <div class="square-white"><span class="piece-black">&#9819;</span></div>
        <div class="square-black"><span class="piece-black">&#9818;</span></div>
        <div class="square-white"><span class="piece-black">&#9821;</span></div>
        <div class="square-black"><span class="piece-black">&#9822;</span></div>
        <div class="square-white"><span class="piece-black">&#9820;</span></div>
        <!-- Rank 7 -->
        <div class="square-white"><span class="piece-black">&#9823;</span></div>
        <div class="square-black"><span class="piece-black">&#9823;</span></div>
        <div class="square-white"><span class="piece-black">&#9823;</span></div>
        <div class="square-black"><span class="piece-black">&#9823;</span></div>
        <div class="square-white"><span class="piece-black">&#9823;</span></div>
        <div class="square-black"><span class="piece-black">&#9823;</span></div>
        <div class="square-white"><span class="piece-black">&#9823;</span></div>
        <div class="square-black"><span class="piece-black">&#9823;</span></div>
        <!-- Rank 6 -->
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <!-- Rank 5 -->
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <!-- Rank 4 -->
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <div class="square-black"></div><div class="square-white"></div>
        <!-- Rank 3 -->
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <div class="square-white"></div><div class="square-black"></div>
        <!-- Rank 2 -->
        <div class="square-black"><span class="piece-white">&#9817;</span></div>
        <div class="square-white"><span class="piece-white">&#9817;</span></div>
        <div class="square-black"><span class="piece-white">&#9817;</span></div>
        <div class="square-white"><span class="piece-white">&#9817;</span></div>
        <div class="square-black"><span class="piece-white">&#9817;</span></div>
        <div class="square-white"><span class="piece-white">&#9817;</span></div>
        <div class="square-black"><span class="piece-white">&#9817;</span></div>
        <div class="square-white"><span class="piece-white">&#9817;</span></div>
        <!-- Rank 1 -->
        <div class="square-white"><span class="piece-white">&#9814;</span></div>
        <div class="square-black"><span class="piece-white">&#9816;</span></div>
        <div class="square-white"><span class="piece-white">&#9815;</span></div>
        <div class="square-black"><span class="piece-white">&#9813;</span></div>
        <div class="square-white"><span class="piece-white">&#9812;</span></div>
        <div class="square-black"><span class="piece-white">&#9815;</span></div>
        <div class="square-white"><span class="piece-white">&#9816;</span></div>
        <div class="square-black"><span class="piece-white">&#9814;</span></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
